<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotorFix - Acceso Taller</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
    <div class="pantalla-dividida">
        
        <div class="panel-visual">
            <div class="overlay">
                <div class="titulo-visual">MotorFix</div>
                <div class="subtitulo-visual">Gestión Integral de Taller Mecánico</div>
            </div>
        </div>

        <div class="panel-login">
            <div class="contenido-login">
                <div class="titulo-login">Bienvenido de nuevo</div>
                <div class="subtitulo">Accede a tu área de cliente o taller</div>

                <form id="loginForm">
                    <div class="grupo-input">
                        <label for="email" class="label-auth">Correo Electrónico</label>
                        <input type="email" id="email" name="email" class="input-auth" placeholder="tucorreo@ejemplo.com" required>
                    </div>
                    <div class="grupo-input">
                        <label for="password" class="label-auth">Contraseña</label>
                        <input type="password" id="password" name="password" class="input-auth" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn-motorfix">Arrancar Motor (Entrar)</button>
                </form>
                
                <div class="enlaces-extra">
                    <span>¿Aún no tienes ficha con nosotros? <a href="registro.html" class="enlace-rojo">Regístrate aquí</a></span>
                </div>
            </div>
        </div>

    </div>

    <script src="auth.js"></script>
</body>
</html>
