<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotorFix - Acceso Taller</title>
    <!-- Aquí enlazamos nuestro archivo CSS externo -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="pantalla-dividida">
        
        <!-- Panel Izquierdo: Branding y Visual -->
        <div class="panel-visual">
            <div class="overlay">
                <h1>MotorFix</h1>
                <p>Gestión Integral de Taller Mecánico</p>
            </div>
        </div>

        <!-- Panel Derecho: Zona de Login a pantalla completa -->
        <div class="panel-login">
            <div class="contenido-login">
                <h2>Bienvenido de nuevo</h2>
                <p class="subtitulo">Accede a tu área de cliente o taller</p>

                <form id="form-login">
                    <div class="grupo-input">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required>
                    </div>
                    <div class="grupo-input">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                    </div>
                    <!-- Sin atributo action para usar AJAX con fetch() más adelante -->
                    <button type="submit" class="btn-motorfix">Arrancar Motor (Entrar)</button>
                </form>
                
                <div class="enlaces-extra">
                    <p>¿Aún no tienes ficha con nosotros? <a href="registro.html">Regístrate aquí</a></p>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
