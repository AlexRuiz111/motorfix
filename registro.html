<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotorFix - Registro de Cliente</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
    <div class="pantalla-dividida">
        
        <div class="panel-visual">
            <div class="overlay">
                <div class="titulo-visual">MotorFix</div>
                <div class="subtitulo-visual">Únete a nuestro taller</div>
            </div>
        </div>

        <div class="panel-login">
            <div class="contenido-login">
                <div class="titulo-login">Crea tu cuenta</div>
                <div class="subtitulo">Regístrate para gestionar tus vehículos y citas</div>

                <form id="registroForm">
                    <div class="grupo-input">
                        <label for="nombre" class="label-auth">Nombre</label>
                        <input type="text" id="nombre" name="nombre" class="input-auth" placeholder="Ej: Elena" required>
                    </div>

                    <div class="grupo-input">
                        <label for="apellidos" class="label-auth">Apellidos</label>
                        <input type="text" id="apellidos" name="apellidos" class="input-auth" placeholder="Ej: García López" required>
                    </div>
                    
                    <div class="grupo-input">
                        <label for="dni" class="label-auth">DNI / NIE</label>
                        <input type="text" id="dni" name="dni" class="input-auth" placeholder="12345678X" required>
                    </div>

                    <div class="grupo-input">
                        <label for="telefono" class="label-auth">Teléfono</label>
                        <input type="tel" id="telefono" name="telefono" class="input-auth" placeholder="600 000 000" required>
                    </div>

                    <div class="grupo-input">
                        <label for="email" class="label-auth">Correo Electrónico</label>
                        <input type="email" id="email" name="email" class="input-auth" placeholder="tucorreo@ejemplo.com" required>
                    </div>

                    <div class="grupo-input">
                        <label for="password" class="label-auth">Contraseña</label>
                        <input type="password" id="password" name="password" class="input-auth" placeholder="••••••••" required>
                    </div>

                    <div class="grupo-input">
                        <label for="confirm_password" class="label-auth">Confirmar Contraseña</label>
                        <input type="password" id="confirm_password" name="confirm_password" class="input-auth" placeholder="••••••••" required>
                    </div>
                    
                    <button type="submit" class="btn-motorfix">Registrarse</button>
                </form>
                
                <div class="enlaces-extra">
                    <span>¿Ya tienes una ficha con nosotros? <a href="index.html" class="enlace-rojo">Inicia sesión aquí</a></span>
                </div>
            </div>
        </div>

    </div>

    <script src="auth.js"></script>
</body>
</html>
