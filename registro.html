<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotorFix - Registro de Cliente</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="pantalla-dividida">
        
        <div class="panel-visual">
            <div class="overlay">
                <h1>MotorFix</h1>
                <p>Únete a nuestro taller</p>
            </div>
        </div>

        <div class="panel-login">
            <div class="contenido-login">
                <h2>Crea tu cuenta</h2>
                <p class="subtitulo">Regístrate para gestionar tus vehículos y citas</p>

                <form id="registroForm">
                    <div class="grupo-input">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Ej: Elena" required>
                    </div>

                    <div class="grupo-input">
                        <label for="apellidos">Apellidos</label>
                        <input type="text" id="apellidos" name="apellidos" placeholder="Ej: García López" required>
                    </div>
                    
                    <div class="grupo-input">
                        <label for="dni">DNI / NIE</label>
                        <input type="text" id="dni" name="dni" placeholder="12345678X" required>
                    </div>

                    <div class="grupo-input">
                        <label for="telefono">Teléfono</label>
                        <input type="tel" id="telefono" name="telefono" placeholder="600 000 000" required>
                    </div>

                    <div class="grupo-input">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required>
                    </div>

                    <div class="grupo-input">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                    </div>

                    <div class="grupo-input">
                        <label for="confirm_password">Confirmar Contraseña</label>
                        <input type="password" id="confirm_password" name="confirm_password" placeholder="••••••••" required>
                    </div>
                    
                    <button type="submit" class="btn-motorfix">Registrarse</button>
                </form>
                
                <div class="enlaces-extra">
                    <p>¿Ya tienes una ficha con nosotros? <a href="index.html">Inicia sesión aquí</a></p>
                </div>
            </div>
        </div>

    </div>

    <script src="auth.js"></script>
</body>
</html>
